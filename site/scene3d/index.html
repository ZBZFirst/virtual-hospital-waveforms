<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>ZeBeZo Hospital Campus | Full Catalog</title>
  <style>
    html, body { margin: 0; height: 100%; background: #101b22; color: #e6f1f5; font: 14px system-ui, sans-serif; }
    #view { position: fixed; inset: 0; }
    #bar { position: fixed; z-index: 2; top: 14px; left: 14px; right: 14px; max-width: 1200px; padding: 9px 11px; border: 1px solid #52707c; border-radius: 10px; background: #132731e8; display: flex; align-items: center; flex-wrap: wrap; gap: 7px; box-shadow: 0 6px 28px #0007; }
    #bar strong { margin-right: 8px; }
    #toggleControls { display: none; }
    button { color: #ecf9fc; background: #244450; border: 1px solid #5a8997; border-radius: 5px; padding: 7px 10px; cursor: pointer; }
    button:hover, button.active { background: #23768b; }
    #status { color: #afcdd4; font-size: 12px; flex-basis: 100%; }
    #tourTime { min-width: 78px; font-variant-numeric: tabular-nums; color: #bfe3e9; }
    #tourScrub { width: 150px; accent-color: #43b3c9; }
    #help { position: fixed; left: 16px; bottom: 14px; z-index: 2; background: #132731d9; padding: 7px 10px; border-radius: 5px; color: #c5e3e9; }
    #error { position: fixed; right: 16px; bottom: 14px; z-index: 3; max-width: 460px; background: #5d2029; padding: 10px; display: none; }
    #cubeHint { position: fixed; z-index: 4; display: none; pointer-events: none; color: #e5f8fb; background: #0b2730ed; border: 1px solid #5caabc; border-radius: 5px; padding: 5px 8px; font-size: 12px; }
    #telemetryDetail { position: fixed; inset: 4vh 4vw; z-index: 8; display: none; flex-direction: column; gap: 8px; padding: 12px; border: 1px solid #52707c; border-radius: 10px; background: #10242af5; box-shadow: 0 10px 50px #000a; }
    #telemetryDetail.open { display: flex; }
    #telemetryDetail header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    #telemetryDetail canvas { width: 100%; min-height: 0; flex: 1; object-fit: contain; background: #08191f; }
    #telemetryDetail small { color: #afcdd4; }
    @media(max-width:650px) { #bar { top: 6px; left: 6px; right: 6px; gap: 5px; padding: 8px; max-height: 32vh; overflow: auto; } button { padding: 6px; } #help { font-size: 11px; } }
    html.embedded #bar { top: 160px; max-width: 780px; max-height: 26vh; overflow: auto; }
    html.embedded #telemetryDetail { top: 140px; }
    html.embedded #help { bottom: 94px; }
    @media(max-width:650px) { html.embedded #bar { top: 155px; max-height: 46vh; } html.embedded #telemetryDetail { top: 165px; } html.embedded #toggleControls { display: inline-block; margin-left: auto; } html.embedded body.controls-collapsed #bar > :not(strong):not(#toggleControls):not(#status) { display: none; } html.embedded body.controls-collapsed #bar { max-height: 100px; } }
    #bar { max-width: 860px; display: flex; flex-direction: column; align-items: stretch; gap: 6px; padding: 9px 11px; overflow: visible; }
    #bar > strong { margin: 0; }
    .toolbar-row { display: flex; align-items: stretch; gap: 6px; min-width: 0; }
    #viewRow, #patientRow, #motionRow { flex: 0 0 36px; height: 36px; }
    .toolbar-row button { min-width: 0; }
    #viewRow button, #patientRow button, #motionRow > button, .tour-media { box-sizing: border-box; height: 36px; }
    #locationRow .toolbar-picker { position: relative; flex: 1 1 0; min-width: 0; }
    .toolbar-picker summary { display: block; list-style: none; padding: 7px 10px; border: 1px solid #5a8997; border-radius: 5px; background: #244450; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .toolbar-picker summary::-webkit-details-marker { display: none; }
    .toolbar-picker summary::after { content: ' ▾'; float: right; }
    .toolbar-picker[open] summary { background: #23768b; }
    .toolbar-options { position: absolute; z-index: 6; top: calc(100% + 4px); left: 0; min-width: 100%; display: grid; grid-template-columns: repeat(2,max-content); gap: 4px; padding: 6px; border: 1px solid #5a8997; border-radius: 6px; background: #132731; box-shadow: 0 8px 22px #0008; }
    .toolbar-options button { white-space: nowrap; }
    #viewRow button, #patientRow button { flex: 1 1 0; }
    #openFeed[hidden] { display: none; }
    #motionRow > button { flex: 0 0 auto; }
    .tour-media { display: flex; flex: 1 1 auto; align-items: center; gap: 7px; min-width: 0; padding: 2px 5px; border: 1px solid #456a76; border-radius: 6px; }
    .tour-media #tourScrub { flex: 1 1 auto; min-width: 80px; width: auto; }
    .tour-media #tourPlay { flex: 0 0 auto; white-space: nowrap; }
    .tour-media #tourTime { flex: 0 0 auto; min-width: 72px; text-align: right; }
    #status { flex-basis: auto; }
    html.embedded #bar { max-width: 850px; max-height: none; overflow: visible; }
    @media(max-width:650px) {
      html.embedded #bar { max-height: 46vh; overflow: auto; }
      html.embedded body.controls-collapsed #bar { max-height: 100px; }
      .toolbar-options { position: static; grid-template-columns: 1fr; }
      .toolbar-options button { white-space: normal; }
      #patientRow, #motionRow { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); }
      #viewRow, #patientRow, #motionRow { height: auto; flex-basis: auto; }
      #patientRow button, #motionRow > button { height: auto; min-height: 36px; }
      .tour-media { grid-column: 1 / -1; }
      #toggleControls { position: absolute; right: 8px; top: 8px; }
      #bar > strong { min-height: 38px; padding-right: 90px; }
      html.embedded body.controls-collapsed #status { max-width: calc(100% - 94px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    }
  </style>
  <script type="importmap">
  {"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/jsm/"}}
  </script>
</head>
<body>
  <div id="view"></div>
  <div id="bar">
    <strong>ZeBeZo hospital campus</strong>
    <button id="toggleControls" aria-expanded="false" aria-controls="bar">Controls ▾</button>
    <div id="locationRow" class="toolbar-row" aria-label="Hospital location">
      <details class="toolbar-picker" id="hospitalPicker"><summary id="hospitalPickerLabel">Hospital A</summary><div class="toolbar-options"><button data-hospital="A">Hospital A</button><button data-hospital="B">Hospital B</button><button data-hospital="C">Hospital C</button><button data-hospital="D">Hospital D</button><button data-hospital="E">Hospital E</button></div></details>
      <details class="toolbar-picker" id="floorPicker"><summary id="floorPickerLabel">Floor</summary><div class="toolbar-options"><button data-floor="1">Floor 1</button><button data-floor="2">Floor 2</button><button data-floor="3">Floor 3</button><button data-floor="4">Floor 4</button><button data-floor="5">Floor 5</button><button data-floor="6">Floor 6</button></div></details>
      <details class="toolbar-picker" id="roomPicker"><summary id="roomPickerLabel">Room</summary><div class="toolbar-options"><button data-room="1">Room 1</button><button data-room="2">Room 2</button><button data-room="3">Room 3</button><button data-room="4">Room 4</button><button data-room="5">Room 5</button><button data-room="6">Room 6</button></div></details>
    </div>
    <div id="viewRow" class="toolbar-row" aria-label="Scene views">
      <button id="hospitalView" aria-pressed="false">Hospital view</button><button id="overview">Floor view</button><button id="walk" aria-pressed="false">Walk mode</button>
    </div>
    <div id="patientRow" class="toolbar-row" aria-label="Patient and inspection controls">
      <button id="previousPatient" aria-label="Previous patient">◀ Patient</button><button id="nextPatient" aria-label="Next patient">Patient ▶</button><button id="inspectTarget" aria-pressed="false">Inspect nursing cube</button><button id="openFeed" hidden>Open full waveform</button>
    </div>
    <div id="motionRow" class="toolbar-row" aria-label="Motion and tour controls">
      <button id="cubeAuto" aria-pressed="true">Pause rotation</button><button id="elevatorDoor" aria-pressed="false">Open elevator</button>
      <div class="tour-media" role="group" aria-label="Unit walk media controls"><button id="tourPlay">Play unit walk</button><input id="tourScrub" aria-label="Unit walking tour position" type="range" min="0" max="1" value="0"><output id="tourTime">0:00 / 0:00</output></div>
    </div>
    <span id="status">Loading scene…</span>
  </div>
  <div id="help">Drag to orbit · wheel to zoom · right drag to pan · select a floor and room above</div>
  <div id="error"></div>
  <div id="cubeHint"></div>
  <section id="telemetryDetail" role="dialog" aria-modal="true" aria-label="PhysioNet telemetry detail">
    <header><strong id="telemetryTitle">PhysioNet telemetry</strong><button id="closeTelemetry">Close</button></header>
    <canvas id="telemetryCanvas" width="1200" height="720"></canvas>
    <small>Full PhysioNet MGH/MF source recording. Channels are shown only when present in the source. <a href="https://physionet.org/content/mghdb/1.0.0/" target="_blank" rel="noopener" style="color:#9bdae9">Source and attribution</a></small>
  </section>
  <script type="module" src="./viewer.js?v=20261029-tablet-sweep6"></script>
</body>
</html>
